name: Build Windows EXE

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Version name for a GitHub Release (for example v1.1.0). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build:win

      - name: Make the zip
        shell: pwsh
        run: |
          Rename-Item "dist/QuackNana Marble Race-win32-x64" "QuackNana Marble Race"
          Compress-Archive -Path "dist/QuackNana Marble Race", "HOW-TO-USE.txt" -DestinationPath "QuackNana-Marble-Race-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: QuackNana-Marble-Race-Windows
          path: QuackNana-Marble-Race-Windows.zip

      - name: Attach to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: QuackNana Marble Race ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: QuackNana-Marble-Race-Windows.zip
          body: |
            Download **QuackNana-Marble-Race-Windows.zip** below.
            1. Right-click the zip and choose **Extract All** (the game will not start from inside the zip).
            2. Open the **QuackNana Marble Race** folder and double-click **QuackNana Marble Race.exe**.
               If Windows says it protected your PC, click **More info** and then **Run anyway**.
            3. Type your YouTube channel handle (like `@QuackNana`) in the Control Panel and click **Connect**.
            Full instructions are in HOW-TO-USE.txt inside the zip.
